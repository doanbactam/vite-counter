<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vite Counter</title>
  <style>
    body { font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f0f0f0; }
    #app { text-align: center; }
    #count { font-size: 4rem; margin: 1rem 0; }
    button { font-size: 1.5rem; padding: 0.5rem 1.5rem; margin: 0 0.5rem; cursor: pointer; }
  </style>
</head>
<body>
  <div id="app">
    <h1>Counter</h1>
    <p id="count">0</p>
    <button id="inc">+</button>
    <button id="dec">-</button>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
